<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Point — Reportes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .tab-btn.active { border-color: var(--accent); background: rgba(232,131,42,0.1); color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .filtros {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: flex-end;
      margin-bottom: 24px;
    }
    .filtros .input-group { min-width: 140px; }
    .filtros .input-group input,
    .filtros .input-group select { padding: 9px 12px; font-size: 13px; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
    }
    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .stat-value { font-family: var(--font-display); font-size: 26px; font-weight: 700; }

    .charts-grid {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 18px;
      margin-bottom: 24px;
    }
    @media (max-width: 860px) {
      .charts-grid { grid-template-columns: 1fr; }
    }
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-card);
    }
    .chart-card h3 { margin-bottom: 14px; }
    .chart-wrap { position: relative; height: 260px; }

    .tablas-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    @media (max-width: 760px) {
      .tablas-grid { grid-template-columns: 1fr; }
    }
    .ranking-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .ranking-row:last-child { border-bottom: none; }
    .ranking-pos {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      width: 18px;
      flex-shrink: 0;
    }
    .ranking-nombre { flex: 1; }
    .ranking-valor { font-family: var(--mono); color: var(--accent); font-weight: 600; white-space: nowrap; }
    .ranking-barra-wrap { flex: 1; height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; margin: 0 10px; }
    .ranking-barra { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 4px; }

    /* ── CIERRE DE CAJA ── */
    .metodo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .metodo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-card);
    }
    .metodo-card .metodo-nombre {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .metodo-card .metodo-monto { font-family: var(--font-display); font-size: 24px; font-weight: 700; color: var(--ok); }
    .metodo-card .metodo-cant { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .metodo-card .metodo-pendiente {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--accent2);
    }
    .balance-card {
      background: linear-gradient(135deg, rgba(232,131,42,0.1), rgba(245,200,66,0.05));
      border: 1px solid rgba(232,131,42,0.3);
      border-radius: var(--radius);
      padding: 22px;
      margin-bottom: 20px;
    }
    .balance-row { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; font-size: 14px; }
    .balance-row.total { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 14px; font-size: 18px; font-weight: 700; }
    .balance-row .label { color: var(--text-muted); }
    .balance-row .valor { font-family: var(--mono); font-weight: 700; }

    @media print {
      .navbar, .filtros, .tabs, .btn { display: none !important; }
      body { background: #fff !important; color: #000 !important; }
      .balance-card, .metodo-card, .resumen-card, .chart-card { border: 1px solid #ccc !important; background: #fff !important; box-shadow: none !important; }
      .incidencia-tipo { background: #eee !important; color: #000 !important; }
    }

    .incidencia-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .incidencia-row:last-child { border-bottom: none; }
    .incidencia-tipo {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(217,79,61,0.15);
      color: #f08070;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .incidencia-tipo-cliente { background: rgba(232,131,42,0.15); color: var(--accent); }
    .incidencia-detalle { flex: 1; }
    .incidencia-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .resumen-card {
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 20px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      border: 1px solid var(--border);
    }
    .resumen-card .resumen-icono { font-size: 28px; line-height: 1; flex-shrink: 0; }
    .resumen-card .resumen-titulo { font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
    .resumen-card .resumen-texto { font-size: 15px; line-height: 1.5; }
    .resumen-card.muy_por_encima, .resumen-card.por_encima { background: rgba(76,175,125,0.08); border-color: rgba(76,175,125,0.3); }
    .resumen-card.normal { background: rgba(138,125,110,0.08); }
    .resumen-card.por_debajo, .resumen-card.muy_por_debajo { background: rgba(217,79,61,0.08); border-color: rgba(217,79,61,0.3); }
    .resumen-card.sin_datos { background: var(--surface); }

    /* ── COMPARATIVA ── */
    .comp-controles { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .comp-periodos { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .comp-periodo-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      text-align: center;
    }
    .comp-periodo-card .comp-label { font-family: var(--mono); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
    .comp-periodo-card .comp-monto { font-family: var(--font-display); font-size: 26px; font-weight: 700; }
    .comp-vs { font-family: var(--mono); font-size: 12px; color: var(--text-muted); }
    .comp-diferencia {
      text-align: center;
      font-family: var(--mono);
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .comp-diferencia.subida { color: var(--ok); }
    .comp-diferencia.bajada { color: var(--danger); }
  </style>
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand"><img src="/img/logo.svg" alt=""> BURGER <span class="point">POINT</span><span class="navbar-subtitle"> · Reportes</span></span>
    <div id="nav-switcher"></div>
    <div class="navbar-right">
      <span class="navbar-role" id="nombre-usuario"></span>
      <button class="btn btn-secondary" onclick="cerrarSesion()" style="padding:6px 14px;font-size:13px;">Salir</button>
    </div>
  </nav>

  <div class="main-content">
    <div class="page-header">
      <div>
        <h1>Reportes</h1>
        <p style="margin-top:4px;">Ventas, productos más pedidos y cómo llegan tus clientes</p>
      </div>
    </div>

    <div class="tabs">
      <div class="tab-btn active" onclick="setTab('ventas', this)">Ventas</div>
      <div class="tab-btn" onclick="setTab('cierre', this)">Cierre de caja</div>
      <div class="tab-btn" onclick="setTab('comparativa', this)">Comparativa</div>
    </div>

    <!-- VENTAS -->
    <div class="tab-panel active" id="panel-ventas">
      <div class="filtros">
        <div class="input-group">
          <label>Desde</label>
          <input type="date" id="f-desde">
        </div>
        <div class="input-group">
          <label>Hasta</label>
          <input type="date" id="f-hasta">
        </div>
        <div class="input-group">
          <label>Canal</label>
          <select id="f-canal">
            <option value="">Todos</option>
            <option value="presencial">Presencial</option>
            <option value="whatsapp">WhatsApp</option>
            <option value="delivery">Delivery</option>
            <option value="online">Online (menú digital)</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="cargarReportes()">Buscar</button>
        <button class="btn btn-secondary" onclick="setRango(7)">Últimos 7 días</button>
        <button class="btn btn-secondary" onclick="setRango(30)">Últimos 30 días</button>
      </div>

      <div class="stats-grid" id="stats-grid"></div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3>Ventas por día</h3>
          <div class="chart-wrap"><canvas id="chart-dias"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Ventas por canal</h3>
          <div class="chart-wrap"><canvas id="chart-canal"></canvas></div>
        </div>
      </div>

      <div class="tablas-grid">
        <div class="chart-card">
          <h3>🏆 Productos más pedidos</h3>
          <div id="ranking-productos"></div>
        </div>
        <div class="chart-card">
          <h3>✨ Extras más elegidos</h3>
          <div id="ranking-extras"></div>
        </div>
      </div>
    </div>

    <!-- CIERRE DE CAJA -->
    <div class="tab-panel" id="panel-cierre">
      <div class="filtros">
        <div class="input-group">
          <label>Desde</label>
          <input type="date" id="c-desde">
        </div>
        <div class="input-group">
          <label>Hasta</label>
          <input type="date" id="c-hasta">
        </div>
        <button class="btn btn-primary" onclick="cargarCierre()">Buscar</button>
        <button class="btn btn-secondary" onclick="setDiaCierre(0)">Hoy</button>
        <button class="btn btn-secondary" onclick="setDiaCierre(1)">Ayer</button>
        <button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimir</button>
      </div>

      <div class="resumen-card" id="resumen-card"></div>

      <div class="metodo-grid" id="metodo-grid"></div>

      <div class="balance-card" id="balance-card"></div>

      <div class="chart-card" id="cancelados-card"></div>

      <div class="chart-card" id="incidencias-card" style="margin-bottom:0;"></div>
    </div>

    <!-- COMPARATIVA -->
    <div class="tab-panel" id="panel-comparativa">
      <div class="comp-controles">
        <div class="input-group">
          <label>Comparar por</label>
          <select id="comp-unidad" onchange="cambiarUnidadComp()">
            <option value="dia">Día</option>
            <option value="semana">Semana</option>
            <option value="mes">Mes</option>
          </select>
        </div>
        <button class="btn btn-secondary" onclick="moverComparativa(1)" style="align-self:flex-end;">‹ Período anterior</button>
        <button class="btn btn-secondary" onclick="moverComparativa(-1)" id="btn-comp-siguiente" style="align-self:flex-end;">Siguiente ›</button>
      </div>

      <div class="comp-periodos" id="comp-periodos"></div>
      <div class="comp-diferencia" id="comp-diferencia"></div>

      <div class="chart-card">
        <h3>Total vendido por período</h3>
        <div class="chart-wrap"><canvas id="chart-comparativa"></canvas></div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
  <script>
    let chartDias = null
    let chartCanal = null

    const COLOR_TEXT_MUTED = '#8a7d6e'
    const COLOR_BORDER = '#2e2720'
    const COLOR_ACCENT = '#e8832a'
    const COLOR_ACCENT2 = '#f5c842'

    const CANAL_LABEL = { presencial: 'Presencial', whatsapp: 'WhatsApp', delivery: 'Delivery', online: 'Online' }
    const CANAL_COLOR = { presencial: '#e8832a', whatsapp: '#4caf7d', delivery: '#f5c842', online: '#5a9bd8' }

    window.addEventListener('load', () => {
      if (!requireAuth(['propietario', 'encargado'], 'reportes')) return
      renderNavSwitcher()
      const usuario = getUsuario()
      document.getElementById('nombre-usuario').textContent = usuario.nombre
      setRango(30)
      setDiaCierre(0)
      cargarComparativa()
    })

    function setTab(tab, el) {
      document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'))
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'))
      el.classList.add('active')
      document.getElementById('panel-' + tab).classList.add('active')
    }

    function setRango(dias) {
      const hasta = new Date()
      const desde = new Date()
      desde.setDate(desde.getDate() - (dias - 1))
      document.getElementById('f-desde').value = desde.toISOString().slice(0, 10)
      document.getElementById('f-hasta').value = hasta.toISOString().slice(0, 10)
      cargarReportes()
    }

    async function cargarReportes() {
      const params = new URLSearchParams()
      const desde = document.getElementById('f-desde').value
      const hasta = document.getElementById('f-hasta').value
      const canal = document.getElementById('f-canal').value
      if (desde) params.set('desde', desde)
      if (hasta) params.set('hasta', hasta)
      if (canal) params.set('canal', canal)

      const data = await api('/api/reportes?' + params.toString())
      if (!data) return
      if (data.error) { toast(data.error, 'danger'); return }

      renderStats(data)
      renderChartDias(data.ventasPorDia)
      renderChartCanal(data.ventasPorCanal)
      renderRanking('ranking-productos', data.topProductos.map(p => ({
        nombre: p.nombre, valor: p.cantidad, etiqueta: `${p.cantidad}x · $${p.total.toLocaleString('es-AR')}`
      })))
      renderRanking('ranking-extras', data.topExtras.map(e => ({
        nombre: e.nombre, valor: e.veces, etiqueta: `${e.veces}x`
      })))
    }

    function renderStats(data) {
      document.getElementById('stats-grid').innerHTML = `
        <div class="stat-card"><div class="stat-label">Total vendido</div><div class="stat-value text-ok">$${data.totalVentas.toLocaleString('es-AR')}</div></div>
        <div class="stat-card"><div class="stat-label">Pedidos</div><div class="stat-value">${data.totalPedidos}</div></div>
        <div class="stat-card"><div class="stat-label">Ticket promedio</div><div class="stat-value text-accent">$${Math.round(data.ticketPromedio).toLocaleString('es-AR')}</div></div>
        <div class="stat-card"><div class="stat-label">Cancelados</div><div class="stat-value text-danger">${data.cancelados}</div></div>
      `
    }

    function renderChartDias(filas) {
      const ctx = document.getElementById('chart-dias')
      const labels = filas.map(f => new Date(f.fecha + 'T00:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }))
      const valores = filas.map(f => f.total)

      if (chartDias) chartDias.destroy()
      chartDias = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Ventas',
            data: valores,
            borderColor: COLOR_ACCENT,
            backgroundColor: 'rgba(232,131,42,0.12)',
            fill: true,
            tension: 0.3,
            pointRadius: 3,
            pointBackgroundColor: COLOR_ACCENT
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: COLOR_TEXT_MUTED, font: { size: 10 } }, grid: { color: COLOR_BORDER } },
            y: { ticks: { color: COLOR_TEXT_MUTED, font: { size: 10 }, callback: v => '$' + v.toLocaleString('es-AR') }, grid: { color: COLOR_BORDER } }
          }
        }
      })
    }

    function renderChartCanal(filas) {
      const ctx = document.getElementById('chart-canal')
      const labels = filas.map(f => CANAL_LABEL[f.canal] || f.canal)
      const valores = filas.map(f => f.total)
      const colores = filas.map(f => CANAL_COLOR[f.canal] || COLOR_ACCENT2)

      if (chartCanal) chartCanal.destroy()

      if (filas.length === 0) {
        ctx.getContext('2d').clearRect(0, 0, ctx.width, ctx.height)
        return
      }

      chartCanal = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: valores, backgroundColor: colores, borderColor: '#1a1612', borderWidth: 2 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom', labels: { color: COLOR_TEXT_MUTED, font: { size: 11 }, padding: 12 } } }
        }
      })
    }

    function renderRanking(contId, filas) {
      const cont = document.getElementById(contId)
      if (filas.length === 0) {
        cont.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:24px;font-size:13px;">Sin datos en este rango</div>`
        return
      }
      const max = Math.max(...filas.map(f => f.valor))
      cont.innerHTML = filas.map((f, i) => `
        <div class="ranking-row">
          <span class="ranking-pos">#${i + 1}</span>
          <span class="ranking-nombre">${f.nombre}</span>
          <div class="ranking-barra-wrap"><div class="ranking-barra" style="width:${max ? (f.valor / max * 100) : 0}%;"></div></div>
          <span class="ranking-valor">${f.etiqueta}</span>
        </div>
      `).join('')
    }

    // ── CIERRE DE CAJA ──

    const METODO_LABEL = { efectivo: '💵 Efectivo', tarjeta: '💳 Tarjeta', transferencia: '🏦 Transferencia' }

    function setDiaCierre(diasAtras) {
      const fecha = new Date()
      fecha.setDate(fecha.getDate() - diasAtras)
      const iso = fecha.toISOString().slice(0, 10)
      document.getElementById('c-desde').value = iso
      document.getElementById('c-hasta').value = iso
      cargarCierre()
    }

    async function cargarCierre() {
      const params = new URLSearchParams()
      const desde = document.getElementById('c-desde').value
      const hasta = document.getElementById('c-hasta').value
      if (desde) params.set('desde', desde)
      if (hasta) params.set('hasta', hasta)

      const data = await api('/api/reportes/cierre?' + params.toString())
      if (!data) return
      if (data.error) { toast(data.error, 'danger'); return }
      renderCierre(data)
    }

    const RESUMEN_ICONO = {
      muy_por_encima: '🎉', por_encima: '📈', normal: '👍',
      por_debajo: '📉', muy_por_debajo: '⚠️', sin_datos: 'ℹ️'
    }

    function renderResumen(resumen, esUnDia) {
      const cont = document.getElementById('resumen-card')
      cont.className = 'resumen-card ' + resumen.categoria
      cont.innerHTML = `
        <span class="resumen-icono">${RESUMEN_ICONO[resumen.categoria] || 'ℹ️'}</span>
        <div>
          <div class="resumen-titulo">${esUnDia ? 'Resumen del día' : 'Resumen del período'}</div>
          <div class="resumen-texto">${resumen.texto}</div>
        </div>
      `
    }

    function renderCierre(data) {
      renderResumen(data.resumen, data.desde === data.hasta)

      document.getElementById('metodo-grid').innerHTML = data.porMetodo.map(m => `
        <div class="metodo-card">
          <div class="metodo-nombre">${METODO_LABEL[m.metodo] || m.metodo}</div>
          <div class="metodo-monto">$${m.confirmado.monto.toLocaleString('es-AR')}</div>
          <div class="metodo-cant">${m.confirmado.cantidad} cobro${m.confirmado.cantidad === 1 ? '' : 's'}</div>
          ${m.pendiente.cantidad > 0 ? `
            <div class="metodo-pendiente">⏳ $${m.pendiente.monto.toLocaleString('es-AR')} sin verificar (${m.pendiente.cantidad})</div>
          ` : ''}
        </div>
      `).join('')

      const rango = data.desde === data.hasta
        ? new Date(data.desde + 'T00:00:00').toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' })
        : `${new Date(data.desde + 'T00:00:00').toLocaleDateString('es-AR')} — ${new Date(data.hasta + 'T00:00:00').toLocaleDateString('es-AR')}`

      document.getElementById('balance-card').innerHTML = `
        <h3 style="margin-bottom:12px;">Balance — ${rango}</h3>
        <div class="balance-row"><span class="label">Confirmado (efectivo + tarjeta + transferencias verificadas)</span><span class="valor text-ok">$${data.totalConfirmado.toLocaleString('es-AR')}</span></div>
        <div class="balance-row"><span class="label">Pendiente de verificar</span><span class="valor" style="color:var(--accent2);">$${data.totalPendiente.toLocaleString('es-AR')}</span></div>
        <div class="balance-row total"><span class="label">Total general</span><span class="valor">$${data.totalGeneral.toLocaleString('es-AR')}</span></div>
      `

      document.getElementById('cancelados-card').innerHTML = `
        <h3>Pedidos cancelados</h3>
        <p style="margin-top:8px;">${data.cancelados.cantidad} pedido${data.cancelados.cantidad === 1 ? '' : 's'} cancelado${data.cancelados.cantidad === 1 ? '' : 's'}${data.cancelados.total > 0 ? ` — hubieran sumado $${data.cancelados.total.toLocaleString('es-AR')}` : ''}</p>
      `

      renderIncidencias(data.incidencias)
    }

    const TIPO_INCIDENCIA_LABEL = {
      error_cocina: '🔥 Error de cocina',
      entrega_fallida: '🛵 Entrega fallida',
      stock_faltante: '📦 Falta de stock',
      queja_cliente: '💬 Queja de cliente',
      cancelacion: '✕ Cancelación',
      otro: '📝 Otro'
    }

    function renderIncidencias(incidencias) {
      const cont = document.getElementById('incidencias-card')
      if (!incidencias || incidencias.length === 0) {
        cont.innerHTML = `
          <h3>🗒️ Incidencias y quejas</h3>
          <p style="margin-top:8px;color:var(--ok);">✅ No se reportó ningún problema en este rango</p>
        `
        return
      }
      const deClientes = incidencias.filter(i => i.origen === 'cliente').length
      cont.innerHTML = `
        <h3>🗒️ Incidencias y quejas (${incidencias.length})${deClientes > 0 ? ` — ${deClientes} de clientes` : ''}</h3>
        <div style="margin-top:8px;">
          ${incidencias.map(i => `
            <div class="incidencia-row">
              <span class="incidencia-tipo ${i.origen === 'cliente' ? 'incidencia-tipo-cliente' : ''}">${TIPO_INCIDENCIA_LABEL[i.tipo] || i.tipo}</span>
              <div class="incidencia-detalle">
                ${i.descripcion || 'Sin descripción'}
                <div class="incidencia-meta">
                  ${i.origen === 'cliente' ? '👤 ' : '👨‍🍳 '}${i.numero_pedido ? `Pedido #${i.numero_pedido} · ` : ''}${i.reportado_por ? `${i.origen === 'cliente' ? '' : 'reportado por '}${i.reportado_por} · ` : ''}${formatFecha(i.creado_en)}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `
    }

    // ── COMPARATIVA ──

    let compUnidad = 'dia'
    let compOffset = 0
    let chartComparativa = null

    function cambiarUnidadComp() {
      compUnidad = document.getElementById('comp-unidad').value
      compOffset = 0
      cargarComparativa()
    }

    function moverComparativa(delta) {
      compOffset = Math.max(0, compOffset + delta)
      cargarComparativa()
    }

    // Devuelve { actual: {desde,hasta,label}, anterior: {desde,hasta,label} } según
    // la unidad elegida (día/semana/mes) y cuántos períodos atrás (compOffset)
    function calcularRangosComparativa() {
      const iso = d => d.toISOString().slice(0, 10)

      if (compUnidad === 'dia') {
        const actual = new Date(); actual.setDate(actual.getDate() - compOffset)
        const anterior = new Date(actual); anterior.setDate(anterior.getDate() - 1)
        return {
          actual: { desde: iso(actual), hasta: iso(actual), label: compOffset === 0 ? 'Hoy' : actual.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) },
          anterior: { desde: iso(anterior), hasta: iso(anterior), label: compOffset === 0 ? 'Ayer' : anterior.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' }) }
        }
      }

      if (compUnidad === 'semana') {
        const finActual = new Date(); finActual.setDate(finActual.getDate() - compOffset * 7)
        const inicioActual = new Date(finActual); inicioActual.setDate(inicioActual.getDate() - 6)
        const finAnterior = new Date(inicioActual); finAnterior.setDate(finAnterior.getDate() - 1)
        const inicioAnterior = new Date(finAnterior); inicioAnterior.setDate(inicioAnterior.getDate() - 6)
        const fmt = d => d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })
        return {
          actual: { desde: iso(inicioActual), hasta: iso(finActual), label: `${fmt(inicioActual)} — ${fmt(finActual)}` },
          anterior: { desde: iso(inicioAnterior), hasta: iso(finAnterior), label: `${fmt(inicioAnterior)} — ${fmt(finAnterior)}` }
        }
      }

      // mes
      const base = new Date()
      const mesActualIdx = base.getMonth() - compOffset
      const inicioActual = new Date(base.getFullYear(), mesActualIdx, 1)
      const finActual = new Date(base.getFullYear(), mesActualIdx + 1, 0)
      const inicioAnterior = new Date(base.getFullYear(), mesActualIdx - 1, 1)
      const finAnterior = new Date(base.getFullYear(), mesActualIdx, 0)
      const fmtMes = d => d.toLocaleDateString('es-AR', { month: 'long', year: 'numeric' })
      return {
        actual: { desde: iso(inicioActual), hasta: iso(finActual), label: fmtMes(inicioActual) },
        anterior: { desde: iso(inicioAnterior), hasta: iso(finAnterior), label: fmtMes(inicioAnterior) }
      }
    }

    async function cargarComparativa() {
      const { actual, anterior } = calcularRangosComparativa()

      const [dataActual, dataAnterior] = await Promise.all([
        api(`/api/reportes?desde=${actual.desde}&hasta=${actual.hasta}`),
        api(`/api/reportes?desde=${anterior.desde}&hasta=${anterior.hasta}`)
      ])
      if (!dataActual || !dataAnterior) return

      renderComparativa(actual, dataActual, anterior, dataAnterior)
    }

    function renderComparativa(actual, dataActual, anterior, dataAnterior) {
      document.getElementById('comp-periodos').innerHTML = `
        <div class="comp-periodo-card">
          <div class="comp-label">${anterior.label}</div>
          <div class="comp-monto">$${dataAnterior.totalVentas.toLocaleString('es-AR')}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${dataAnterior.totalPedidos} pedidos</div>
        </div>
        <div class="comp-vs">VS</div>
        <div class="comp-periodo-card">
          <div class="comp-label">${actual.label}</div>
          <div class="comp-monto">$${dataActual.totalVentas.toLocaleString('es-AR')}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:4px;">${dataActual.totalPedidos} pedidos</div>
        </div>
      `

      const diffEl = document.getElementById('comp-diferencia')
      if (dataAnterior.totalVentas === 0) {
        diffEl.textContent = dataActual.totalVentas > 0 ? '📈 Sin ventas en el período anterior para comparar' : 'Sin ventas en ninguno de los dos períodos'
        diffEl.className = 'comp-diferencia'
      } else {
        const variacion = ((dataActual.totalVentas - dataAnterior.totalVentas) / dataAnterior.totalVentas) * 100
        const subio = variacion >= 0
        diffEl.textContent = `${subio ? '📈' : '📉'} ${subio ? '+' : ''}${variacion.toFixed(1)}% respecto al período anterior`
        diffEl.className = 'comp-diferencia ' + (subio ? 'subida' : 'bajada')
      }

      const ctx = document.getElementById('chart-comparativa')
      if (chartComparativa) chartComparativa.destroy()
      chartComparativa = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: [anterior.label, actual.label],
          datasets: [{
            data: [dataAnterior.totalVentas, dataActual.totalVentas],
            backgroundColor: [COLOR_TEXT_MUTED, COLOR_ACCENT],
            borderRadius: 6,
            maxBarThickness: 90
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: COLOR_TEXT_MUTED, font: { size: 11 } }, grid: { display: false } },
            y: { ticks: { color: COLOR_TEXT_MUTED, font: { size: 10 }, callback: v => '$' + v.toLocaleString('es-AR') }, grid: { color: COLOR_BORDER } }
          }
        }
      })
    }
  </script>
</body>
</html>
