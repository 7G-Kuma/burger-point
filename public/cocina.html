<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Point — Cocina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    .cocina-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .pedido-cocina {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .pedido-cocina.urgente {
      border-color: var(--danger);
      box-shadow: 0 0 0 1px var(--danger);
    }
    .pedido-cocina.nuevo {
      border-color: var(--accent2);
    }
    .pedido-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
    }
    .pedido-num-big {
      font-family: var(--mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--accent);
    }
    .pedido-timer {
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .timer-ok      { background: rgba(76,175,125,0.15); color: var(--ok); }
    .timer-warning { background: rgba(245,200,66,0.15); color: var(--accent2); }
    .timer-danger  { background: rgba(217,79,61,0.15);  color: var(--danger); }
    .pedido-items-list {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-cocina {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .item-qty {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      width: 28px;
    }
    .item-nombre {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .item-obs {
      font-size: 12px;
      color: var(--accent2);
      margin-top: 2px;
    }
    .pedido-obs-general {
      margin: 0 16px 12px;
      background: rgba(245,200,66,0.08);
      border: 1px solid rgba(245,200,66,0.2);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--accent2);
    }
    .pedido-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .empty-cocina {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-cocina .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.3; }
    .filtro-tabs {
      display: flex;
      gap: 8px;
      padding: 16px 24px 0;
      max-width: 1200px;
      margin: 0 auto;
    }
    .filtro-tab {
      padding: 6px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .filtro-tab.active {
      border-color: var(--accent);
      background: rgba(232,131,42,0.1);
      color: var(--accent);
    }
    .contador-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #000;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 6px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand"><img src="/img/logo.svg" alt=""> BURGER <span class="point">POINT</span> · Cocina</span>
    <div id="nav-switcher"></div>
    <div class="navbar-right">
      <span class="navbar-role" id="nombre-usuario"></span>
      <span id="reloj" style="font-family:var(--mono);font-size:13px;color:var(--text-muted);"></span>
      <button class="btn btn-secondary" onclick="cerrarSesion()" style="padding:6px 14px;font-size:13px;">Salir</button>
    </div>
  </nav>

  <!-- FILTROS -->
  <div class="filtro-tabs">
    <div class="filtro-tab active" onclick="setFiltro('activos', this)">
      Activos <span class="contador-badge" id="cnt-activos">0</span>
    </div>
    <div class="filtro-tab" onclick="setFiltro('en_preparacion', this)">En preparación</div>
    <div class="filtro-tab" onclick="setFiltro('listo', this)">Listos</div>
    <div class="filtro-tab" onclick="setFiltro('todos', this)">Todos hoy</div>
  </div>

  <!-- PEDIDOS -->
  <div class="cocina-grid" id="cocina-grid">
    <div class="empty-cocina">
      <div class="icon">👨‍🍳</div>
      <h3>Cargando pedidos...</h3>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
  <script>
    let filtroActual = 'activos'
    let todosPedidos = []

    window.addEventListener('load', () => {
      if (!requireAuth(['cocina', 'encargado', 'propietario'])) return
      renderNavSwitcher()
      const usuario = getUsuario()
      document.getElementById('nombre-usuario').textContent = usuario.nombre

      cargarPedidos()
      setInterval(cargarPedidos, 15000) // actualiza cada 15 seg
      setInterval(actualizarReloj, 1000)
      actualizarReloj()
    })

    function actualizarReloj() {
      const ahora = new Date()
      document.getElementById('reloj').textContent =
        ahora.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
    }

    function setFiltro(filtro, el) {
      filtroActual = filtro
      document.querySelectorAll('.filtro-tab').forEach(t => t.classList.remove('active'))
      el.classList.add('active')
      renderPedidos()
    }

    async function cargarPedidos() {
      const data = await api('/api/pedidos?limite=100')
      if (!data) return
      todosPedidos = data.pedidos || []

      const activos = todosPedidos.filter(p =>
        ['recibido','confirmado','en_preparacion'].includes(p.estado)
      ).length
      document.getElementById('cnt-activos').textContent = activos

      renderPedidos()
    }

    function renderPedidos() {
      const grid = document.getElementById('cocina-grid')
      let pedidos = todosPedidos

      if (filtroActual === 'activos') {
        pedidos = todosPedidos.filter(p =>
          ['recibido','confirmado','en_preparacion'].includes(p.estado)
        )
      } else if (filtroActual !== 'todos') {
        pedidos = todosPedidos.filter(p => p.estado === filtroActual)
      }

      if (pedidos.length === 0) {
        grid.innerHTML = `
          <div class="empty-cocina">
            <div class="icon">✅</div>
            <h3>Sin pedidos activos</h3>
            <p>Cuando llegue un pedido nuevo aparece acá automáticamente</p>
          </div>`
        return
      }

      grid.innerHTML = pedidos.map(p => {
        const minutos = Math.floor((Date.now() - new Date(p.creado_en)) / 60000)
        const timerClass = minutos < 10 ? 'timer-ok' : minutos < 20 ? 'timer-warning' : 'timer-danger'
        const urgente = minutos >= 20
        const esNuevo = p.estado === 'recibido'

        return `
          <div class="pedido-cocina ${urgente ? 'urgente' : ''} ${esNuevo ? 'nuevo' : ''}">
            <div class="pedido-header">
              <div>
                <div class="pedido-num-big">#${p.numero_pedido}</div>
                <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize;margin-top:2px;">
                  ${p.canal} · ${badgeEstado(p.estado)}
                </div>
              </div>
              <span class="pedido-timer ${timerClass}">${minutos} min</span>
            </div>

            <div class="pedido-items-list">
              ${p.pedido_items?.map(i => `
                <div class="item-cocina">
                  <span class="item-qty">${i.cantidad}x</span>
                  <div>
                    <div class="item-nombre">${i.productos?.nombre || '—'}</div>
                    ${i.observacion ? `<div class="item-obs">⚠ ${i.observacion}</div>` : ''}
                  </div>
                </div>
              `).join('') || '<p style="color:var(--text-muted);font-size:13px;">Sin items</p>'}
            </div>

            ${p.observaciones ? `<div class="pedido-obs-general">📝 ${p.observaciones}</div>` : ''}

            <div class="pedido-footer">
              ${botonesAccion(p)}
            </div>
          </div>`
      }).join('')
    }

    function botonesAccion(p) {
      if (p.estado === 'recibido') {
        return `<button class="btn btn-primary btn-full" onclick="cambiarEstado('${p.id}','en_preparacion')">
          🔥 Iniciar preparación
        </button>`
      }
      if (p.estado === 'confirmado') {
        return `<button class="btn btn-primary btn-full" onclick="cambiarEstado('${p.id}','en_preparacion')">
          🔥 Iniciar preparación
        </button>`
      }
      if (p.estado === 'en_preparacion') {
        return `
          <button class="btn btn-ok btn-full" onclick="cambiarEstado('${p.id}','listo')">
            ✓ Listo para entregar
          </button>
          <button class="btn btn-danger" onclick="registrarError('${p.id}')" style="flex-shrink:0;padding:10px 14px;">
            ⚠
          </button>`
      }
      if (p.estado === 'listo') {
        return `<button class="btn btn-secondary btn-full" disabled>
          ✓ Esperando retiro
        </button>`
      }
      return ''
    }

    async function cambiarEstado(pedidoId, estado) {
      const data = await api(`/api/pedidos/${pedidoId}/estado`, {
        method: 'PATCH',
        body: JSON.stringify({ estado })
      })
      if (data?.ok) {
        toast('Estado actualizado', 'ok')
        cargarPedidos()
      } else {
        toast('Error al actualizar', 'danger')
      }
    }

    async function registrarError(pedidoId) {
      const tipo = prompt('Tipo de error:\n1. Ingrediente equivocado\n2. Quemado\n3. Olvidé modificación\n4. Otro\n\nEscribí el número:')
      const tipos = { '1':'error_cocina', '2':'error_cocina', '3':'error_cocina', '4':'otro' }
      const descripciones = {
        '1':'Ingrediente equivocado',
        '2':'Pedido quemado — rehecho',
        '3':'Modificación olvidada — rehecho',
        '4': prompt('Describí el error:') || 'Error de cocina'
      }
      if (!tipo || !tipos[tipo]) return

      const data = await api('/api/incidencias', {
        method: 'POST',
        body: JSON.stringify({
          pedido_id: pedidoId,
          tipo: tipos[tipo],
          descripcion: descripciones[tipo]
        })
      })
      if (data?.ok) toast('Error registrado', 'warning')
    }
  </script>
</body>
</html>
