<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Point — Menú Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    .menu-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
    }
    .menu-nav img { width: 40px; height: 40px; }
    .menu-nav span { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
    .menu-nav .point { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px 40px;
    }
    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
    }
    .productos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
    }
    .producto-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }
    .producto-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .producto-card.sin-stock { opacity: 0.55; }

    .producto-img {
      position: relative;
      aspect-ratio: 4 / 3;
      background: linear-gradient(135deg, var(--surface2), var(--bg));
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .producto-img img { width: 100%; height: 100%; object-fit: cover; }
    .producto-img-fallback {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
    }
    .producto-img-fallback .icono { font-size: 40px; opacity: 0.5; }
    .producto-img-fallback .texto { font-family: var(--mono); font-size: 9px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.6; }
    .producto-img .stock-chip {
      position: absolute;
      top: 8px;
      right: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(217,79,61,0.9);
      color: #fff;
      font-weight: 700;
    }

    .producto-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .producto-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .producto-head .nombre { font-size: 14px; font-weight: 700; font-family: var(--font-display); }
    .producto-head .precio { font-family: var(--mono); font-size: 13px; color: var(--accent); white-space: nowrap; }
    .producto-head .precio-viejo { text-decoration: line-through; color: var(--text-muted); font-size: 11px; margin-right: 4px; }
    .producto-head .precio-promo { color: var(--ok); }
    .chip-descuento {
      position: absolute;
      top: 8px;
      left: 8px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.5px;
      padding: 3px 9px;
      border-radius: 20px;
      background: rgba(76,175,125,0.9);
      color: #06120c;
      font-weight: 700;
    }
    .producto-body .descripcion { font-size: 12px; color: var(--text-muted); line-height: 1.4; flex: 1; }
    .producto-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
    .producto-footer .stock { font-family: var(--mono); font-size: 10px; color: var(--text-muted); }
    .producto-footer .stock.bajo { color: var(--accent2); }
    .btn-add {
      font-size: 12px;
      padding: 7px 14px;
    }
    .producto-card.sin-stock .btn-add { display: none; }

    .carrito-items { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; min-height: 80px; }
    .carrito-item { background: var(--surface2); border-radius: 6px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; }
    .carrito-item .nombre { flex: 1; font-size: 13px; }
    .qty-btn { width: 24px; height: 24px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
    .carrito-item .subtotal { font-family: var(--mono); font-size: 12px; color: var(--accent); width: 60px; text-align: right; }
    .total-box { background: var(--surface2); border-radius: 8px; padding: 16px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .total-box .monto { font-size: 26px; font-weight: 700; color: var(--ok); }

    .entrega-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .entrega-tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; font-size: 13px; font-weight: 600; text-align: center; }
    .entrega-tab.active { border-color: var(--accent); background: rgba(232,131,42,0.1); color: var(--accent); }

    .confirmacion { text-align: center; padding: 20px 0; }
    .confirmacion .num { font-family: var(--font-display); font-size: 40px; font-weight: 700; color: var(--accent); margin: 12px 0; }

    .cart-bar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 150;
      background: var(--surface);
      border-top: 1px solid var(--border);
      box-shadow: 0 -8px 24px rgba(0,0,0,0.4);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }
    .cart-bar .info { font-size: 13px; font-weight: 600; }
    .cart-bar .info .count {
      background: var(--accent);
      color: #1a1108;
      border-radius: 20px;
      padding: 2px 9px;
      font-family: var(--mono);
      font-size: 12px;
      margin-right: 8px;
    }
    .cart-bar .total { font-family: var(--mono); font-size: 16px; font-weight: 700; color: var(--ok); }

    @media (max-width: 760px) {
      .cart-bar.visible { display: flex; }
      .layout { padding-bottom: 80px; }
      .qty-btn { width: 34px; height: 34px; font-size: 16px; }
      .productos-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>

  <div class="menu-nav">
    <img src="/img/logo.svg" alt="">
    <span>BURGER <span class="point">POINT</span> · Menú Digital</span>
  </div>

  <div class="layout">
    <div>
      <div class="page-header">
        <h2>Armá tu pedido</h2>
      </div>
      <div class="productos-grid" id="productos-grid">
        <div style="color:var(--text-muted);font-size:13px;">Cargando menú...</div>
      </div>
    </div>

    <div>
      <div class="card" id="card-pedido" style="position:sticky;top:20px;">
        <div class="card-header">
          <h3>Tu pedido</h3>
          <button class="btn btn-secondary" onclick="limpiarCarrito()" style="font-size:12px;padding:4px 10px;">Limpiar</button>
        </div>

        <div class="carrito-items" id="carrito-items">
          <div style="text-align:center;color:var(--text-muted);font-size:13px;padding:24px 0;">Seleccioná productos</div>
        </div>

        <div class="total-box">
          <span class="label" style="font-family:var(--mono);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);">Total</span>
          <span class="monto" id="total-display">$0</span>
        </div>

        <div class="entrega-tabs">
          <div class="entrega-tab active" onclick="setEntrega('retiro', this)">🏠 Retiro en el local</div>
          <div class="entrega-tab" onclick="setEntrega('delivery', this)">🛵 Delivery</div>
        </div>

        <div class="input-group mt-8">
          <label>Tu nombre</label>
          <input type="text" id="cliente-nombre" placeholder="Nombre y apellido">
        </div>
        <div class="input-group mt-8">
          <label>Teléfono</label>
          <input type="tel" id="cliente-telefono" placeholder="Para avisarte del pedido">
        </div>
        <div class="input-group mt-8" id="grupo-direccion" style="display:none;">
          <label>Dirección de entrega</label>
          <input type="text" id="cliente-direccion" placeholder="Calle, número, referencia">
        </div>
        <div class="input-group mt-8">
          <label>Observaciones (opcional)</label>
          <input type="text" id="observaciones" placeholder="Sin cebolla, timbre roto...">
        </div>

        <button class="btn btn-primary btn-full mt-16" onclick="confirmarPedido()" id="btn-confirmar">
          Confirmar pedido
        </button>
      </div>
    </div>
  </div>

  <div class="cart-bar" id="cart-bar" onclick="scrollToCart()">
    <span class="info"><span class="count" id="cart-bar-count">0</span>Ver mi pedido</span>
    <span class="total" id="cart-bar-total">$0</span>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
  <script>
    let productos = []
    let carrito = []
    let tipoEntrega = 'retiro'

    window.addEventListener('load', () => {
      cargarMenu()
    })

    function setEntrega(tipo, el) {
      tipoEntrega = tipo
      document.querySelectorAll('.entrega-tab').forEach(t => t.classList.remove('active'))
      el.classList.add('active')
      document.getElementById('grupo-direccion').style.display = tipo === 'delivery' ? 'flex' : 'none'
    }

    function slugify(nombre) {
      return nombre.toLowerCase()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/&/g, 'y')
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '')
    }

    async function cargarMenu() {
      const res = await fetch('/api/menu')
      const data = await res.json()
      productos = data.productos || []
      const grid = document.getElementById('productos-grid')
      if (productos.length === 0) {
        grid.innerHTML = `<div style="color:var(--text-muted);font-size:13px;">El menú no está disponible en este momento</div>`
        return
      }
      grid.innerHTML = productos.map(p => {
        const sinStock = p.disponible !== null && p.disponible <= 0
        const bajoStock = !sinStock && p.disponible !== null && p.disponible <= 5
        const img = `/img/productos/${slugify(p.nombre)}.jpg`
        return `
        <div class="producto-card ${sinStock ? 'sin-stock' : ''}">
          <div class="producto-img">
            <img src="${img}" alt="${p.nombre}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
            <div class="producto-img-fallback" style="display:none;">
              <span class="icono">🍔</span>
              <span class="texto">Foto próximamente</span>
            </div>
            ${sinStock ? '<span class="stock-chip">Agotado</span>' : ''}
            ${p.descuento_porcentaje ? `<span class="chip-descuento">-${p.descuento_porcentaje}%</span>` : ''}
          </div>
          <div class="producto-body">
            <div class="producto-head">
              <span class="nombre">${p.nombre}</span>
              <span class="precio">
                ${p.descuento_porcentaje ? `<span class="precio-viejo">$${Number(p.precio).toLocaleString('es-AR')}</span><span class="precio-promo">$${Number(p.precio_final).toLocaleString('es-AR')}</span>` : `$${Number(p.precio).toLocaleString('es-AR')}`}
              </span>
            </div>
            <p class="descripcion">${p.descripcion || ''}</p>
            <div class="producto-footer">
              <span class="stock ${bajoStock ? 'bajo' : ''}">${bajoStock ? `Quedan ${p.disponible}` : ''}</span>
              <button class="btn btn-primary btn-add" onclick="agregarAlCarrito('${p.id}')">+ Agregar</button>
            </div>
          </div>
        </div>`
      }).join('')
    }

    function agregarAlCarrito(productoId) {
      const prod = productos.find(p => p.id === productoId)
      if (!prod) return
      const existe = carrito.find(i => i.producto_id === productoId)
      const enCarrito = existe ? existe.cantidad : 0

      if (prod.disponible !== null && enCarrito + 1 > prod.disponible) {
        toast(`No hay más stock de "${prod.nombre}"`, 'warning')
        return
      }

      if (existe) existe.cantidad++
      else carrito.push({ producto_id: productoId, nombre: prod.nombre, precio_unitario: prod.precio_final, cantidad: 1 })
      renderCarrito()
    }

    function cambiarCantidad(productoId, delta) {
      const item = carrito.find(i => i.producto_id === productoId)
      if (!item) return
      if (delta > 0) {
        const prod = productos.find(p => p.id === productoId)
        if (prod?.disponible !== null && item.cantidad + delta > prod.disponible) {
          toast(`No hay más stock de "${prod.nombre}"`, 'warning')
          return
        }
      }
      item.cantidad += delta
      if (item.cantidad <= 0) carrito = carrito.filter(i => i.producto_id !== productoId)
      renderCarrito()
    }

    function limpiarCarrito() {
      carrito = []
      renderCarrito()
    }

    function renderCarrito() {
      const cont = document.getElementById('carrito-items')
      const cartBar = document.getElementById('cart-bar')
      const cantidadTotal = carrito.reduce((s, i) => s + i.cantidad, 0)

      if (carrito.length === 0) {
        cont.innerHTML = `<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:24px 0;">Seleccioná productos</div>`
        document.getElementById('total-display').textContent = '$0'
        cartBar.classList.remove('visible')
        return
      }
      cont.innerHTML = carrito.map(i => `
        <div class="carrito-item">
          <span class="nombre">${i.nombre}</span>
          <button class="qty-btn" onclick="cambiarCantidad('${i.producto_id}', -1)">−</button>
          <span style="font-size:14px;font-weight:600;width:16px;text-align:center;">${i.cantidad}</span>
          <button class="qty-btn" onclick="cambiarCantidad('${i.producto_id}', 1)">+</button>
          <span class="subtotal">$${(i.cantidad * i.precio_unitario).toLocaleString('es-AR')}</span>
        </div>
      `).join('')
      const total = carrito.reduce((s, i) => s + i.cantidad * i.precio_unitario, 0)
      document.getElementById('total-display').textContent = '$' + total.toLocaleString('es-AR')
      document.getElementById('cart-bar-count').textContent = cantidadTotal
      document.getElementById('cart-bar-total').textContent = '$' + total.toLocaleString('es-AR')
      cartBar.classList.add('visible')
    }

    function scrollToCart() {
      document.getElementById('card-pedido')?.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    async function confirmarPedido() {
      if (carrito.length === 0) { toast('Agregá al menos un producto', 'warning'); return }

      const nombre = document.getElementById('cliente-nombre').value.trim()
      const telefono = document.getElementById('cliente-telefono').value.trim()
      const direccion = document.getElementById('cliente-direccion').value.trim()

      if (!nombre || !telefono) { toast('Completá tu nombre y teléfono', 'warning'); return }
      if (tipoEntrega === 'delivery' && !direccion) { toast('Completá la dirección de entrega', 'warning'); return }

      const btn = document.getElementById('btn-confirmar')
      btn.disabled = true
      btn.textContent = 'Enviando...'

      const res = await fetch('/api/menu/pedido', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo_entrega: tipoEntrega,
          cliente_nombre: nombre,
          cliente_telefono: telefono,
          cliente_direccion: direccion,
          observaciones: document.getElementById('observaciones').value,
          items: carrito.map(i => ({ producto_id: i.producto_id, cantidad: i.cantidad }))
        })
      })
      const data = await res.json()

      btn.disabled = false
      btn.textContent = 'Confirmar pedido'

      if (data?.ok) {
        mostrarConfirmacion(data.pedido.numero_pedido)
      } else {
        toast(data?.error || 'Error al enviar el pedido', 'danger')
      }
    }

    function mostrarConfirmacion(numero) {
      document.getElementById('cart-bar').classList.remove('visible')
      document.getElementById('card-pedido').innerHTML = `
        <div class="confirmacion">
          <div style="font-size:40px;">✅</div>
          <p>¡Pedido recibido!</p>
          <div class="num">#${numero}</div>
          <p style="margin-bottom:16px;">Ya le avisamos a Burger Point — te va a llegar una confirmación.</p>
          <a class="btn btn-primary btn-full" href="/seguimiento.html?numero=${numero}">Seguir mi pedido</a>
          <button class="btn btn-secondary btn-full mt-8" onclick="location.reload()">Hacer otro pedido</button>
        </div>
      `
    }
  </script>
</body>
</html>
