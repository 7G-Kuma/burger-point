<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burger Point — Reparto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/img/logo.svg">
  <link rel="stylesheet" href="/css/estilos.css">
  <style>
    .reparto-wrap { max-width: 880px; margin: 0 auto; padding: 24px; }

    .reparto-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .reparto-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-card);
    }
    .reparto-stat .label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }
    .reparto-stat .valor {
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 800;
    }
    .reparto-stat .valor.accent { color: var(--accent2); }
    .reparto-stat .valor.ok { color: var(--ok); }

    .reparto-filtros {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .reparto-filtro {
      padding: 7px 15px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .reparto-filtro.active {
      border-color: var(--accent);
      background: rgba(255,107,0,0.12);
      color: var(--accent2);
    }

    .reparto-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pedido-reparto {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }
    .pedido-reparto.pendiente-cobro {
      border-color: var(--accent2);
      box-shadow: 0 0 0 1px rgba(245,166,35,0.3);
    }
    .reparto-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .reparto-num {
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
    }
    .reparto-canal {
      font-size: 11px;
      text-transform: capitalize;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .reparto-items {
      font-size: 13px;
      color: var(--text);
      margin-bottom: 10px;
    }
    .reparto-cobro {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .cobro-badge {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .cobro-cobrado, .cobro-verificado {
      background: rgba(76,175,125,0.15); color: #4caf7d; border: 1px solid rgba(76,175,125,0.3);
    }
    .cobro-pendiente {
      background: rgba(245,166,35,0.15); color: #f5a623; border: 1px solid rgba(245,166,35,0.3);
    }
    .reparto-footer {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <span class="navbar-brand"><img src="/img/logo.svg" alt=""> BURGER <span class="point">POINT</span><span class="navbar-subtitle"> · Reparto</span></span>
    <div id="nav-switcher"></div>
    <div class="navbar-right">
      <span class="navbar-role" id="nombre-usuario"></span>
      <button class="btn btn-secondary" onclick="cerrarSesion()" style="padding:6px 14px;font-size:13px;">Salir</button>
    </div>
  </nav>

  <div class="reparto-wrap">
    <div class="page-header">
      <h2>Entregas del turno</h2>
      <button class="btn btn-secondary" onclick="cargarPedidos()" style="font-size:12px;padding:6px 12px;">↻</button>
    </div>

    <div class="reparto-stats">
      <div class="reparto-stat">
        <div class="label">🛵 En camino</div>
        <div class="valor accent" id="stat-en-camino">0</div>
      </div>
      <div class="reparto-stat">
        <div class="label">🏠 Retiro en local</div>
        <div class="valor accent" id="stat-retiro">0</div>
      </div>
      <div class="reparto-stat">
        <div class="label">💸 Cobro pendiente</div>
        <div class="valor" id="stat-pendiente-cobro">0</div>
      </div>
      <div class="reparto-stat">
        <div class="label">✓ Entregados hoy</div>
        <div class="valor ok" id="stat-entregados">0</div>
      </div>
    </div>

    <div class="reparto-filtros">
      <div class="reparto-filtro active" onclick="setFiltroReparto('pendientes', this)">Por entregar</div>
      <div class="reparto-filtro" onclick="setFiltroReparto('delivery', this)">🛵 Delivery</div>
      <div class="reparto-filtro" onclick="setFiltroReparto('retiro', this)">🏠 Retiro</div>
      <div class="reparto-filtro" onclick="setFiltroReparto('entregados', this)">Entregados hoy</div>
    </div>

    <div class="reparto-list" id="reparto-list">
      <div class="empty-state">
        <div class="empty-icon">🛵</div>
        <h3>Cargando entregas...</h3>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="/app.js"></script>
  <script>
    let todosPedidosReparto = []
    let filtroReparto = 'pendientes'

    window.addEventListener('load', () => {
      if (!requireAuth(['reparto', 'encargado', 'propietario'], 'reparto')) return
      renderNavSwitcher()
      const usuario = getUsuario()
      document.getElementById('nombre-usuario').textContent = usuario.nombre
      cargarPedidos()
      setInterval(cargarPedidos, 15000)
    })

    function setFiltroReparto(filtro, el) {
      filtroReparto = filtro
      document.querySelectorAll('.reparto-filtro').forEach(t => t.classList.remove('active'))
      el.classList.add('active')
      renderListaReparto()
    }

    async function cargarPedidos() {
      const data = await api('/api/pedidos?limite=100')
      if (!data) return

      todosPedidosReparto = (data.pedidos || []).filter(p =>
        ['listo', 'entregado'].includes(p.estado)
      )

      const listos = todosPedidosReparto.filter(p => p.estado === 'listo')
      document.getElementById('stat-en-camino').textContent = listos.filter(p => p.canal === 'delivery').length
      document.getElementById('stat-retiro').textContent = listos.filter(p => p.canal !== 'delivery').length
      document.getElementById('stat-entregados').textContent = todosPedidosReparto.filter(p => p.estado === 'entregado').length
      document.getElementById('stat-pendiente-cobro').textContent =
        todosPedidosReparto.filter(p => p.cobros?.[0]?.estado === 'pendiente').length

      renderListaReparto()
    }

    function renderListaReparto() {
      let pedidos = todosPedidosReparto
      if (filtroReparto === 'pendientes')      pedidos = pedidos.filter(p => p.estado === 'listo')
      else if (filtroReparto === 'delivery')   pedidos = pedidos.filter(p => p.estado === 'listo' && p.canal === 'delivery')
      else if (filtroReparto === 'retiro')     pedidos = pedidos.filter(p => p.estado === 'listo' && p.canal !== 'delivery')
      else if (filtroReparto === 'entregados') pedidos = pedidos.filter(p => p.estado === 'entregado')

      const lista = document.getElementById('reparto-list')

      if (pedidos.length === 0) {
        lista.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">✅</div>
            <h3>Sin entregas pendientes</h3>
            <p>Los pedidos listos para salir van a aparecer acá</p>
          </div>`
        return
      }

      lista.innerHTML = pedidos.map(p => {
        const cobro = p.cobros?.[0]
        const pendienteCobro = cobro && cobro.estado === 'pendiente'

        return `
          <div class="pedido-reparto ${pendienteCobro ? 'pendiente-cobro' : ''}">
            <div class="reparto-header">
              <div>
                <div class="reparto-num">#${p.numero_pedido}</div>
                <div class="reparto-canal">${p.canal}</div>
              </div>
              ${badgeEstado(p.estado)}
            </div>

            <div class="reparto-items">
              ${p.pedido_items?.map(i => `${i.cantidad}x ${i.productos?.nombre}`).join(', ') || '—'}
              — <span class="mono text-accent">$${(p.total || 0).toLocaleString('es-AR')}</span>
            </div>

            ${cobro ? `
              <div class="reparto-cobro">
                <span class="cobro-badge cobro-${cobro.estado}">${cobro.metodo} · ${cobro.estado}</span>
              </div>
            ` : `
              <div class="reparto-cobro">
                <span class="cobro-badge cobro-pendiente">sin cobro registrado</span>
              </div>
            `}

            <div class="reparto-footer">
              ${p.estado === 'listo' ? `
                <button class="btn btn-ok btn-full" onclick="marcarEntregado('${p.id}')">
                  ✓ Marcar entregado
                </button>` : ''}
              ${pendienteCobro ? `
                <button class="btn btn-primary" onclick="verificarTransferencia('${cobro.id}')" style="flex-shrink:0;">
                  🏦 Confirmar transferencia
                </button>` : ''}
              <button class="btn btn-secondary" onclick="abrirModalIncidencia('${p.id}', ${p.numero_pedido})" style="flex-shrink:0;">
                ⚠️
              </button>
            </div>
          </div>`
      }).join('')
    }

    async function marcarEntregado(pedidoId) {
      const data = await api(`/api/pedidos/${pedidoId}/estado`, {
        method: 'PATCH',
        body: JSON.stringify({ estado: 'entregado' })
      })
      if (data?.ok) {
        toast('Pedido entregado', 'ok')
        cargarPedidos()
      } else {
        toast('Error al actualizar', 'danger')
      }
    }

    async function verificarTransferencia(cobroId) {
      const data = await api(`/api/cobros/${cobroId}/verificar`, { method: 'PATCH' })
      if (data?.ok) {
        toast('Transferencia verificada', 'ok')
        cargarPedidos()
      } else {
        toast('Error al verificar', 'danger')
      }
    }
  </script>
</body>
</html>
